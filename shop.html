<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASKVN Shop</title><style>body{font-family:system-ui;background:#0b1020;color:#fff;margin:0;padding:20px}.wrap{max-width:850px;margin:auto}.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.c{background:#151c32;padding:20px;border-radius:18px}.f,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:10px}.f{background:#0e152a;color:#fff;border:1px solid #39476e}button{background:#5b7cfa;color:#fff;border:0;font-weight:700}.muted{color:#aab4d0}.ok{color:#56e39f}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="index.html" style="color:#9eb1ff">← Trang chủ</a></p><h1>🛒 TASKVN SHOP</h1><div class="g"><section class="c"><h2>💳 Nạp tiền vào ví</h2><p class="muted">Số dư ví được dùng để mua dịch vụ/thẻ. Chỉ cộng tiền sau khi giao dịch được đối soát.</p><input class="f" id="a" type="number" min="10000" placeholder="Số tiền (VNĐ)"><button onclick="topup()">Tạo yêu cầu nạp</button><div id="bank"></div><p id="p"></p></section><section class="c"><h2>🎫 Mua thẻ</h2><select class="f" id="t"><option value="viettel">Viettel</option><option value="vinaphone">VinaPhone</option><option value="mobifone">MobiFone</option><option value="garena">Garena</option></select><select class="f" id="m"><option>10000</option><option>20000</option><option>50000</option><option>100000</option><option>200000</option><option>500000</option></select><button onclick="card()">Tạo đơn mua thẻ</button><p id="c"></p></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const C=window.TASKVN_CONFIG,sb=C&&!C.SUPABASE_URL.includes("YOUR-")?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY):null;async function auth(){if(!sb)throw Error("Cấu hình Supabase trước");let{data:{user}}=await sb.auth.getUser();if(!user)throw Error("Hãy đăng nhập trước");return user}async function topup(){try{await auth();let amount=+a.value;if(!Number.isInteger(amount)||amount<10000)return p.textContent="Tối thiểu 10.000đ";let{data,error}=await sb.rpc("create_topup",{p_amount:amount});if(error)throw error;let{data:st}=await sb.from("app_settings").select("key,value").in("key",["topup_bank","topup_account","topup_owner"]);let o={};(st||[]).forEach(x=>o[x.key]=typeof x.value==="string"?x.value:(x.value?.value||x.value));bank.innerHTML=`<div class=c>Ngân hàng: <b>${o.topup_bank||"Chưa cấu hình"}</b><br>STK: <b>${o.topup_account||"Chưa cấu hình"}</b><br>Chủ TK: <b>${o.topup_owner||"Chưa cấu hình"}</b><br>Nội dung: <b>${data.transfer_code}</b><br>Số tiền: <b>${amount.toLocaleString("vi-VN")}đ</b></div>`;p.textContent="Đã tạo yêu cầu. Sau khi chuyển khoản, hệ thống sẽ đối soát và cộng tiền."}catch(e){p.textContent=e.message}}async function card(){try{await auth();let r=await fetch("/api/card/orders",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({card_type:t.value,amount:+m.value})});c.textContent=JSON.stringify(await r.json())}catch(e){c.textContent=e.message}}</script></body></html>
